{% extends 'base.html' %}
{% block content %}
<div class="relatorios-container">
    <div class="relatorios-header"><h2>Relatórios</h2></div>
    <div class="relatorios-box">
        <a href="{% url 'relatorios:periodo' tipo='venda' %}" class="btn-relatorio">Relatório de Venda</a>
        <a href="{% url 'relatorios:periodo' tipo='itens-vendidos' %}" class="btn-relatorio">Itens mais Vendidos</a>
        <a href="{% url 'relatorios:periodo' tipo='estoque' %}" class="btn-relatorio">Estoque Atual</a>
        <a href="{% url 'relatorios:periodo' tipo='faturamento' %}" class="btn-relatorio">Faturamento</a>
    </div>
</div>
<style>
.relatorios-container{
    background:#eaf4fa;
    padding:20px;
    border-radius:8px;
    border:1px solid #d7e8f2;
}
.relatorios-header{
    background:#fff;
    padding:12px 18px;
    border-radius:6px;
    margin-bottom:16px;
    border:1px solid #e5e5e5;
}
.relatorios-header h2{
    margin:0;
    color:#495057;
    font-size:1.5rem;
}
.relatorios-box{
    background:#fff;
    padding:40px;
    border-radius:6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    border:1px solid #e5e5e5;
}
.btn-relatorio{
    display:block;
    width:260px;
    text-align:center;
    background:#b83fd6;
    color:#fff;
    font-weight:600;
    padding:13px 0;
    border-radius:6px;
    text-decoration:none;
    transition:background 0.15s ease;
}
.btn-relatorio:hover{
    background:#9d2fb8;
    color:#fff;
}
</style>
{% endblock %}
