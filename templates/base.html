{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="container-fluid p-3">

    <div class="topbar">
        <span class="brand-title">Lacinho System</span>
    </div>

    <div class="main-wrapper">
        <div class="row g-3">

            <div class="col-md-2">
                <div class="sidebar">
                    <a href="{% url 'relatorios:dashboard' %}" class="nav-link d-block">
                        <i class="bi bi-house-door-fill"></i> Dashboard
                    </a>

                    <a href="{% url 'produto:listar' %}" class="nav-link d-block">
                        <i class="bi bi-box-seam"></i> Gerenciar Produto
                    </a>

                    <a href="{% url 'estoque:listar' %}" class="nav-link d-block">
                        <i class="bi bi-clipboard2-data"></i> Gerenciar Estoque
                    </a>

                    <a href="{% url 'clientes:listar_clientes' %}" class="nav-link d-block">
                        <i class="bi bi-people"></i> Gerenciar Cliente
                    </a>

                    <a href="{% url 'venda:listar' %}" class="nav-link d-block">
                        <i class="bi bi-cart-fill"></i> Gerenciar Venda
                    </a>

                    <a href="{% url 'relatorios:home' %}" class="nav-link d-block">
                        <i class="bi bi-file-earmark-bar-graph"></i> Gerar Relatorio
                    </a>
                </div>
            </div>

            <div class="col-md-10">
                <div class="content-area">
                    {% block content %}
                    {% endblock %}
                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}

</body>
</html>
