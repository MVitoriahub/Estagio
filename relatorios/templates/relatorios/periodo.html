{% extends 'base.html' %}
{% block content %}
<div class="relatorios-container">
    <a href="{% url 'relatorios:home' %}" class="btn-voltar-topo">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
    <div class="relatorios-header">
        <h2>{{ tipo_label }} — Escolha o Período</h2>
    </div>
    <div class="relatorios-box">
        {% for chave, dados in periodos.items %}
            <a href="{% url 'relatorios:gerar' tipo=tipo %}?periodo={{ chave }}" class="btn-relatorio">{{ dados.0 }}</a>
        {% endfor %}
    </div>
</div>
<style>
.relatorios-container{
    background:#eaf4fa;
    padding:20px;
    border-radius:8px;
    border:1px solid #d7e8f2;
}
.btn-voltar-topo{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:#6c757d;
    text-decoration:none;
    font-size:0.9rem;
    margin-bottom:12px;
    padding:6px 12px;
    border-radius:6px;
    border:1px solid #c9dae4;
    background:#fff;
}
.btn-voltar-topo:hover{
    background:#f1f7fb;
    color:#495057;
}
.relatorios-header{
    background:#fff;
    padding:12px 18px;
    border-radius:6px;
    margin-bottom:16px;
    border:1px solid #e5e5e5;
}
.relatorios-header h2{
    margin:0;
    color:#495057;
    font-size:1.5rem;
}
.relatorios-box{
    background:#fff;
    padding:40px;
    border-radius:6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    border:1px solid #e5e5e5;
}
.btn-relatorio{
    display:block;
    width:260px;
    text-align:center;
    background:#b83fd6;
    color:#fff;
    font-weight:600;
    padding:13px 0;
    border-radius:6px;
    text-decoration:none;
    transition:background 0.15s ease;
}
.btn-relatorio:hover{
    background:#9d2fb8;
    color:#fff;
}
</style>
{% endblock %}
